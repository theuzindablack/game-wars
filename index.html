<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMES WARS | Central de Comando</title>
    <style>
        :root {
            --primary: #00f2ff;
            --bg-dark: #020202;
            --bg-card: #0d1117;
            --text: #ffffff;
            --accent: #ff00ea;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* BARRA DE NAVEGAÇÃO */
        nav {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid var(--primary);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
            text-decoration: none;
        }

        .nav-links a {
            color: #ccc;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-links a:hover { color: var(--primary); }

        /* DESTAQUE (HERO SECTION) */
        .hero {
            height: 350px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), var(--bg-dark)), 
                        url('https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&q=80&w=2070');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h1 { font-size: 48px; margin: 0; text-transform: uppercase; letter-spacing: 5px; }
        .hero p { color: var(--primary); font-size: 18px; margin-top: 10px; }

        /* CONTAINER DE JOGOS */
        .container { padding: 40px 5%; }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--accent);
            padding-left: 15px;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 25px;
        }

        /* CARD VAZIO / ESPERANDO JOGO */
        .game-card {
            background: var(--bg-card);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #222;
            transition: 0.4s;
            cursor: pointer;
            position: relative;
            min-height: 250px;
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 242, 255, 0.3);
        }

        .placeholder-img {
            height: 180px;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-weight: bold;
            font-size: 40px;
        }

        .game-card-info { padding: 15px; }
        .game-card-info h3 { margin: 0 0 10px; font-size: 18px; color: #555; }
        .category-tag {
            font-size: 10px;
            background: #222;
            color: #555;
            padding: 3px 8px;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* MODAL */
        .game-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
        }

        .modal-content {
            width: 90%; height: 85%;
            margin: 2% auto;
            background: #000;
            position: relative;
            border: 2px solid var(--primary);
            border-radius: 10px;
        }

        .close-modal {
            position: absolute;
            top: -40px; right: 0;
            color: white; font-size: 30px;
            cursor: pointer;
            background: none; border: none;
        }

        iframe { width: 100%; height: 100%; border: none; border-radius: 10px; }

        footer {
            padding: 50px;
            text-align: center;
            border-top: 1px solid #222;
            color: #444;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">GAMES WARS</a>
        <div class="nav-links">
            <a href="#">INÍCIO</a>
            <a href="#">BIBLIOTECA</a>
            <a href="#">SOBRE</a>
        </div>
    </nav>

    <section class="hero">
        <h1>GAMES WARS</h1>
        <p>Aguardando Inserção de Novas Missões...</p>
    </section>

    <div class="container">
        
        <div class="section-header">
            <h2>MEU ARSENAL DE JOGOS</h2>
        </div>

        <div class="grid">
            
            <div class="game-card" onclick="alert('Copia este bloco no código para adicionar um novo jogo!')">
                <div class="placeholder-img">+</div>
                <div class="game-card-info">
                    <span class="category-tag">Status: Disponível</span>
                    <h3>Adicionar Novo Jogo</h3>
                </div>
            </div>

        </div>
    </div>

    <div id="gameModal" class="game-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeGame()">✕ FECHAR</button>
            <iframe id="gameFrame" src=""></iframe>
        </div>
    </div>

    <footer>
        <p>© 2026 <strong style="color:var(--primary)">GAMES WARS</strong>. Todos os direitos reservados.</p>
        <p>Portal Privado - Desenvolvido por Games Wars Project.</p>
    </footer>

    <script>
        function openGame(url) {
            document.getElementById('gameFrame').src = url;
            document.getElementById('gameModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeGame() {
            document.getElementById('gameFrame').src = '';
            document.getElementById('gameModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
